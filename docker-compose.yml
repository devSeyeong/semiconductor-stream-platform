version: '3'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # 리스너 2개: 컨테이너끼리는 INTERNAL(kafka:29092), 호스트에서는
      # EXTERNAL(localhost:9092). 브로커는 접속 경로별로 "이 주소로 접속하라"고
      # 되돌려주므로, 하나만 두면 둘 중 한쪽은 반드시 연결에 실패한다.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: semiconductor

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.23
    ports:
      - "7474:7474"   # HTTP (Neo4j Browser)
      - "7687:7687"   # Bolt (드라이버 연결)
    environment:
      NEO4J_AUTH: neo4j/semiconductor
      # APOC 등 확장 없이도 동작. 메모리 여유 없으면 아래 조절.
      NEO4J_server_memory_heap_max__size: 512M
    volumes:
      - neo4j_data:/data

  # --- Airflow (배치 오케스트레이션) --------------------------------------
  # 무거우므로 profile 로 분리: 기본 `docker compose up -d` 에는 안 뜨고,
  # `docker compose --profile airflow up -d --build` 로만 기동한다.

  airflow-postgres:
    image: postgres:16
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data

  airflow:
    build: ./airflow
    profiles: ["airflow"]
    depends_on:
      - airflow-postgres
      - postgres        # 앱 DB (semiconductor_events)
    ports:
      - "8080:8080"     # Airflow UI (localhost:8080)
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      # 배치 스크립트가 접속할 앱 DB / Neo4j (compose 네트워크의 서비스명)
      PROJECT_DIR: /opt/project
      PYTHONPATH: /opt/project
      PG_HOST: postgres
      PG_DB: semiconductor
      PG_USER: admin
      PG_PASSWORD: admin
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: semiconductor
      GRAPH_ENABLED: "1"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/project              # 기존 파이프라인 스크립트를 그대로 실행
    command: standalone

volumes:
  postgres_data:
  neo4j_data:
  airflow_pg_data: