# 코어 파이프라인 전체 스택.
#
#   로컬 개발  : docker compose up -d          (인프라만 띄우고 앱은 venv 로)
#                docker compose --profile app up -d --build   (앱까지 컨테이너로)
#   EC2 배포   : docker compose --profile app up -d --build
#
# 앱 3종(simulator/consumer/dashboard)을 profile 로 분리한 이유: 로컬에서는
# 코드를 고치며 venv 로 돌리는 게 편하고, EC2 에서는 전부 컨테이너로 띄우는
# 게 편하다. 같은 compose 파일로 두 방식을 모두 지원한다.

# --------------------------------------------------------------------- #
# 앱 컨테이너 공통 환경변수 — config.py 가 읽는 값들.
# 컨테이너끼리는 compose 서비스명으로 붙는다(localhost 아님).
# --------------------------------------------------------------------- #
x-app-env: &app-env
  KAFKA_BOOTSTRAP: kafka:29092
  KAFKA_TOPIC: semiconductor-events
  PG_HOST: postgres
  PG_PORT: "5432"
  PG_DB: ${PG_DB:-semiconductor}
  PG_USER: ${PG_USER:-admin}
  PG_PASSWORD: ${PG_PASSWORD:-admin}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-semiconductor}
  GRAPH_ENABLED: ${GRAPH_ENABLED:-1}
  PYTHONUNBUFFERED: "1"

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      # t3.large(8GB) 에서 JVM 들이 메모리를 나눠 쓰도록 힙을 눌러둔다
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
    restart: unless-stopped
    # 호스트 포트 노출 불필요 (컨테이너끼리만 씀)

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper

    ports:
      # 호스트 루프백에만 바인딩 — 보안그룹과 무관하게 외부에서 못 붙는다.
      # 로컬 개발(venv)에서 localhost:9092 로 붙는 건 그대로 동작.
      - "127.0.0.1:9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # 리스너 2개: 컨테이너끼리는 INTERNAL(kafka:29092), 호스트에서는
      # EXTERNAL(localhost:9092). 브로커는 접속 경로별로 "이 주소로 접속하라"고
      # 되돌려주므로, 하나만 두면 둘 중 한쪽은 반드시 연결에 실패한다.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # simulator 가 첫 이벤트를 보낼 때 토픽이 자동 생성된다
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx768M -Xms768M"
    restart: unless-stopped

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: ${PG_USER:-admin}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-admin}
      POSTGRES_DB: ${PG_DB:-semiconductor}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5.23
    ports:
      - "127.0.0.1:7474:7474"   # HTTP (Neo4j Browser) — SSH 터널로 접근
      - "127.0.0.1:7687:7687"   # Bolt (드라이버 연결)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-semiconductor}
      # APOC 등 확장 없이도 동작. 메모리 여유 없으면 아래 조절.
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  # --- 앱 3종 (profile: app) ---------------------------------------------
  # 같은 이미지를 공유하고 command 로만 갈린다. image 이름을 맞춰두면
  # compose 가 빌드를 한 번만 수행한다.

  simulator:
    build: .
    image: semiconductor-app:latest
    profiles: ["app"]
    command: python simulator/simulator.py
    environment: *app-env
    depends_on:
      - kafka
    # Kafka 가 아직 안 떴으면 죽는데, 재시작하며 자연스럽게 붙는다
    restart: unless-stopped

  consumer:
    build: .
    image: semiconductor-app:latest
    profiles: ["app"]
    command: python consumer/consumer.py
    environment: *app-env
    depends_on:
      - kafka
      - postgres
      - neo4j
    restart: unless-stopped

  dashboard:
    build: .
    image: semiconductor-app:latest
    profiles: ["app"]
    command: >
      streamlit run dashboard/app.py
      --server.address 0.0.0.0
      --server.port 8501
      --server.headless true
      --browser.gatherUsageStats false
    environment: *app-env
    ports:
      # 유일하게 외부로 여는 포트. 보안그룹에서 접근 IP 를 제한한다.
      - "8501:8501"
    depends_on:
      - postgres
    restart: unless-stopped

  # --- Airflow (배치 오케스트레이션) --------------------------------------
  # 무거우므로 profile 로 분리: 기본 `docker compose up -d` 에는 안 뜨고,
  # `docker compose --profile airflow up -d --build` 로만 기동한다.
  # 코어 구성(t3.large)에는 포함되지 않는다 — 메모리가 모자란다.

  airflow-postgres:
    image: postgres:16
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data

  airflow:
    build: ./airflow
    profiles: ["airflow"]
    depends_on:
      - airflow-postgres
      - postgres        # 앱 DB (semiconductor_events)
    ports:
      - "8080:8080"     # Airflow UI (localhost:8080)
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      # 배치 스크립트가 접속할 앱 DB / Neo4j (compose 네트워크의 서비스명)
      PROJECT_DIR: /opt/project
      PYTHONPATH: /opt/project
      PG_HOST: postgres
      PG_DB: ${PG_DB:-semiconductor}
      PG_USER: ${PG_USER:-admin}
      PG_PASSWORD: ${PG_PASSWORD:-admin}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-semiconductor}
      GRAPH_ENABLED: "1"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/project              # 기존 파이프라인 스크립트를 그대로 실행
    command: standalone

volumes:
  postgres_data:
  neo4j_data:
  airflow_pg_data:
