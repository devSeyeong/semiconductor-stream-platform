# 코어 파이프라인 전체 스택.
#
#   로컬 개발  : docker compose up -d          (인프라만 띄우고 앱은 venv 로)
#                docker compose --profile app up -d --build   (앱까지 컨테이너로)
#   EC2 배포   : docker compose --profile app up -d --build
#
# 앱 3종(simulator/consumer/dashboard)을 profile 로 분리한 이유: 로컬에서는
# 코드를 고치며 venv 로 돌리는 게 편하고, EC2 에서는 전부 컨테이너로 띄우는
# 게 편하다. 같은 compose 파일로 두 방식을 모두 지원한다.

# --------------------------------------------------------------------- #
# 앱 컨테이너 공통 환경변수 — config.py 가 읽는 값들.
# 컨테이너끼리는 compose 서비스명으로 붙는다(localhost 아님).
# --------------------------------------------------------------------- #
x-app-env: &app-env
  KAFKA_BOOTSTRAP: kafka:29092
  KAFKA_TOPIC: semiconductor-events
  PG_HOST: postgres
  PG_PORT: "5432"
  PG_DB: ${PG_DB:-semiconductor}
  PG_USER: ${PG_USER:-admin}
  PG_PASSWORD: ${PG_PASSWORD:-admin}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-semiconductor}
  GRAPH_ENABLED: ${GRAPH_ENABLED:-1}
  PYTHONUNBUFFERED: "1"
  # 대시보드의 "배치 오케스트레이션" 탭이 붙을 Airflow.
  # API 는 compose 네트워크 안에서(airflow-webserver), UI 링크는 브라우저가
  # 여는 주소이므로 호스트 기준(localhost 또는 EC2 퍼블릭 IP)이어야 한다.
  AIRFLOW_API_URL: http://airflow-webserver:8080/api/v1
  AIRFLOW_UI_URL: ${AIRFLOW_UI_URL:-http://localhost:8080}
  AIRFLOW_USER: ${AIRFLOW_ADMIN_USER:-admin}
  AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}

# --------------------------------------------------------------------- #
# Airflow 컨테이너 공통 환경변수 (init / webserver / scheduler 3종이 공유).
# 셋이 같은 메타DB·같은 DAG·같은 앱 DB 를 봐야 하므로 한 곳에서 정의한다.
# --------------------------------------------------------------------- #
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  # DAG 이 처음부터 활성 상태여야 스케줄도 돌고 대시보드에서도 바로 보인다.
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  # 대시보드가 REST API(/api/v1/...)로 붙으려면 basic_auth 백엔드가 필요하다.
  # session 도 같이 켜둬야 브라우저 UI 가 그대로 동작한다.
  AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
  # 웹서버가 재시작돼도 로그인 세션이 유지되도록 키를 고정한다.
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-fdc-airflow-secret}
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"

  # 배치 태스크가 접속할 앱 DB / Neo4j (compose 네트워크의 서비스명)
  PROJECT_DIR: /opt/project
  PYTHONPATH: /opt/project
  PG_HOST: postgres
  PG_PORT: "5432"
  PG_DB: ${PG_DB:-semiconductor}
  PG_USER: ${PG_USER:-admin}
  PG_PASSWORD: ${PG_PASSWORD:-admin}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-semiconductor}
  GRAPH_ENABLED: "1"

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      # t3.large(8GB) 에서 JVM 들이 메모리를 나눠 쓰도록 힙을 눌러둔다
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
    restart: unless-stopped
    # 호스트 포트 노출 불필요 (컨테이너끼리만 씀)

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper

    ports:
      # 호스트 루프백에만 바인딩 — 보안그룹과 무관하게 외부에서 못 붙는다.
      # 로컬 개발(venv)에서 localhost:9092 로 붙는 건 그대로 동작.
      - "127.0.0.1:9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # 리스너 2개: 컨테이너끼리는 INTERNAL(kafka:29092), 호스트에서는
      # EXTERNAL(localhost:9092). 브로커는 접속 경로별로 "이 주소로 접속하라"고
      # 되돌려주므로, 하나만 두면 둘 중 한쪽은 반드시 연결에 실패한다.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # simulator 가 첫 이벤트를 보낼 때 토픽이 자동 생성된다
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx768M -Xms768M"
    restart: unless-stopped

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: ${PG_USER:-admin}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-admin}
      POSTGRES_DB: ${PG_DB:-semiconductor}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5.23
    ports:
      - "127.0.0.1:7474:7474"   # HTTP (Neo4j Browser) — SSH 터널로 접근
      - "127.0.0.1:7687:7687"   # Bolt (드라이버 연결)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-semiconductor}
      # APOC 등 확장 없이도 동작. 메모리 여유 없으면 아래 조절.
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  # --- 앱 3종 (profile: app) ---------------------------------------------
  # 같은 이미지를 공유하고 command 로만 갈린다. image 이름을 맞춰두면
  # compose 가 빌드를 한 번만 수행한다.

  simulator:
    build: .
    image: semiconductor-app:latest
    profiles: ["app"]
    command: python simulator/simulator.py
    environment: *app-env
    depends_on:
      - kafka
    # Kafka 가 아직 안 떴으면 죽는데, 재시작하며 자연스럽게 붙는다
    restart: unless-stopped

  consumer:
    build: .
    image: semiconductor-app:latest
    profiles: ["app"]
    command: python consumer/consumer.py
    environment: *app-env
    depends_on:
      - kafka
      - postgres
      - neo4j
    restart: unless-stopped

  dashboard:
    build: .
    image: semiconductor-app:latest
    profiles: ["app"]
    command: >
      streamlit run dashboard/app.py
      --server.address 0.0.0.0
      --server.port 8501
      --server.headless true
      --browser.gatherUsageStats false
    environment: *app-env
    ports:
      # 유일하게 외부로 여는 포트. 보안그룹에서 접근 IP 를 제한한다.
      - "8501:8501"
    depends_on:
      - postgres
    restart: unless-stopped

  # --- Airflow (배치 오케스트레이션) --------------------------------------
  # 무거우므로 profile 로 분리: 기본 `docker compose up -d` 에는 안 뜨고,
  # `docker compose --profile airflow up -d --build` 로만 기동한다.
  # 코어 구성(t3.large)에는 포함되지 않는다 — 메모리가 모자란다.
  #
  # standalone 한 덩어리 대신 init / webserver / scheduler 로 쪼갠 이유:
  # standalone 은 admin 비밀번호를 매 기동마다 랜덤 생성해 컨테이너 안 파일로
  # 떨군다. 그러면 대시보드가 REST API 로 붙을 고정 자격증명이 없다.
  # init 에서 계정을 admin/admin(환경변수로 변경 가능)으로 못박는다.

  airflow-postgres:
    image: postgres:16
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 메타DB 마이그레이션 + admin 계정 생성. 한 번 돌고 끝난다(restart: no).
  # webserver/scheduler 는 이 컨테이너가 정상 종료된 뒤에 뜬다.
  airflow-init:
    build: ./airflow
    image: semiconductor-airflow:latest
    profiles: ["airflow"]
    depends_on:
      - airflow-postgres
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/project
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        airflow db migrate
        # create 는 계정이 이미 있어도 "already exist" 를 찍고 exit 0 을 낸다.
        # (예전 standalone 이 만들어둔 랜덤 비밀번호 admin 이 메타DB 볼륨에
        #  남아있는 경우) 그래서 create 뒤에 reset-password 를 무조건 한 번 더
        # 돌려, 비밀번호가 항상 위 환경변수 값이 되도록 못박는다.
        airflow users create \
          --role Admin \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname FDC --lastname Admin \
          --email admin@example.com
        airflow users reset-password \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}"
    restart: "no"

  airflow-webserver:
    build: ./airflow
    image: semiconductor-airflow:latest
    profiles: ["airflow"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"     # Airflow UI (http://localhost:8080)
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/project
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    build: ./airflow
    image: semiconductor-airflow:latest
    profiles: ["airflow"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/project              # 기존 파이프라인 스크립트를 그대로 실행
    command: scheduler
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  airflow_pg_data:
