version: '3'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: semiconductor

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.23
    ports:
      - "7474:7474"   # HTTP (Neo4j Browser)
      - "7687:7687"   # Bolt (드라이버 연결)
    environment:
      NEO4J_AUTH: neo4j/semiconductor
      # APOC 등 확장 없이도 동작. 메모리 여유 없으면 아래 조절.
      NEO4J_server_memory_heap_max__size: 512M
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data: